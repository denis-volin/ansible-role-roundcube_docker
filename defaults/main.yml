---
# defaults file for roundcube_docker

roundcube_docker_dir: /opt/roundcube-docker

roundcube_docker_compose_name: roundcube

roundcube_docker_tag: 1.7.x-apache-nonroot
roundcube_docker_port: 8080
roundcube_docker_extra_hosts: []

roundcube_docker_imap_host: ""
roundcube_docker_imap_port: 993
roundcube_docker_smtp_host: ""
roundcube_docker_smtp_port: 465

roundcube_docker_des_key: ""
roundcube_docker_env_extra: ""

roundcube_docker_postgres_tag: 18
roundcube_docker_db_password: ""

roundcube_docker_uplooad_max: 32M

roundcube_docker_volumes_extra: []
